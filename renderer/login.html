<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme.css" />
<style>
  body { overflow: hidden; }
  /* Ensure the content stretches and leaves no unused space below */
  .panel { margin: 0 16px; flex: 1; display: flex; flex-direction: column; }
  .btn-row { flex-shrink: 0; }

  .field-row { padding: 12px 14px 0 14px; }
  .field-row label {
    display: block;
    color: var(--accent);
    font-size: 9px;
    font-weight: bold;
    margin-bottom: 4px;
  }
  .field-row input {
    width: 100%;
    padding: 5px 6px;
  }

  .toggle-row {
    padding: 6px 14px 0 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text-sec);
    font-size: 8pt;
    cursor: pointer;
  }

  #accessKeyContainer { padding: 12px 14px 0 14px; }
  #accessKeyField { display: none; }
  #accessKeyToggle {
    color: var(--accent);
    font-size: 8pt;
    cursor: pointer;
  }

  .session-warning {
    color: var(--warning);
    font-size: 8pt;
    text-align: right;
    padding: 8px 14px 14px 14px;
  }

  .server-row {
    padding: 4px 14px 0 14px;
    margin-top: auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .server-row label {
    color: var(--accent);
    font-size: 9px;
    font-weight: bold;
  }

  .server-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .server-label {
    font-size: 11px;
    font-weight: bold;
    color: var(--text-sec);
    cursor: pointer;
    transition: color 0.15s;
  }

  .server-label.active {
    color: var(--accent);
  }

  .toggle-track {
    width: 40px;
    height: 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 9px;
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }

  .toggle-thumb {
    position: absolute;
    top: 1px;
    left: 1px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent);
    transition: transform 0.15s ease;
    box-shadow: 0 0 4px var(--accent);
  }

  .toggle-track.on .toggle-thumb {
    transform: translateX(22px);
  }

  .btn-row {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    padding: 10px 16px 16px 16px;
  }
</style>
</head>
<body>
  <div class="app-window no-glow">

    <div class="titlebar">
      <span class="icon">🔐</span>
      <span class="title">LOGIN</span>
      <span class="spacer"></span>
      <div class="titlebar-btn" id="btnThemeToggle" title="Toggle theme">🌙</div>
      <div class="titlebar-btn" id="btnMinimize">─</div>
      <div class="titlebar-btn close" id="btnClose">✕</div>
    </div>

    <div class="panel">
      <div class="field-row">
        <label>▸ USERNAME</label>
        <input type="text" id="username" />
      </div>

      <div class="field-row">
        <label>▸ PASSWORD</label>
        <input type="password" id="password" />
      </div>
      <label class="toggle-row">
        <input type="checkbox" id="showPassword" />
        Show password
      </label>

      <div id="accessKeyContainer">
        <div id="accessKeyField">
          <label>▸ ACCESS KEY</label>
          <input type="text" id="accessKey" />
        </div>
        <span id="accessKeyToggle">👁  View Access Key</span>
      </div>

      <div class="server-row">
        <label>▸ APPEARANCE</label>
        <div class="server-toggle" id="themeToggleRow">
          <span class="server-label" data-value="dark" id="labelDark">DARK</span>
          <div class="toggle-track" id="appearanceToggleTrack">
            <div class="toggle-thumb"></div>
          </div>
          <span class="server-label" data-value="light" id="labelLight">LIGHT</span>
        </div>
      </div>

      <div class="server-row">
        <label>▸ BEACON SERVER</label>
        <div class="server-toggle" id="serverToggle">
          <span class="server-label" data-value="s2" id="labelS2">S2</span>
          <div class="toggle-track" id="toggleTrack">
            <div class="toggle-thumb"></div>
          </div>
          <span class="server-label" data-value="s4" id="labelS4">S4</span>
        </div>
      </div>

      <div class="session-warning">⚠  Login will clear the active session.</div>
    </div>

    <div class="btn-row">
      <button class="cyber-btn" id="loginBtn">LOGIN</button>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="js/common.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
