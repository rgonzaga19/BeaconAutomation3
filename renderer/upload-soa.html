<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Upload SOA</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme.css" />
<style>
  /* ============================================================
     Upload SOA layout — restyled to match the CF2 console read.
     Structure only: every #id the renderer script (upload-soa.js)
     touches, and its existing class list, is preserved as-is.
     ============================================================ */

  .page-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  .page-header .glyph {
    width: 34px;
    height: 34px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: var(--radius-md);
    font-size: 16px;
  }
  .page-header .title-block { line-height: 1.3; }
  .page-header .title {
    font-family: var(--font-ui);
    color: var(--text-pri);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .page-header .subtitle {
    font-family: var(--font-ui);
    color: var(--text-sec);
    font-size: 10.5px;
    letter-spacing: 0.3px;
  }
  .page-header .btn-home {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-panel);
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius-md);
    font-family: var(--font-ui);
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.3px;
    padding: 8px 14px;
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .page-header .btn-home:hover {
    background: var(--accent-soft);
    color: var(--text-pri);
  }

  /* ---------- SOA folder ---------- */
  .folder-section {
    padding: 14px 24px 4px 24px;
  }
  .section-row {
    margin: 10px 0 0 0;
    display: flex;
    gap: 10px;
  }
  .folder-input-wrapper {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 9px 10px;
    display: flex;
    align-items: center;
  }
  .folder-input-wrapper::before {
    content: "📁";
    margin-right: 8px;
    flex: none;
    font-size: 12px;
    opacity: 0.8;
  }
  #soaFolderInput {
    width: 100%;
    background: transparent;
    color: var(--text-pri);
    border: none;
    font-family: var(--font-mono);
    font-size: 11.5px;
  }
  #soaFolderInput::placeholder { color: var(--text-sec); }
  #browseBtn { flex: none; }

  /* ---------- Two-column body ---------- */
  .body {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 14px 24px 20px 24px;
    min-height: 0;
  }
  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 4px 16px 16px 16px;
  }
  /* 20:80 split — transmittal numbers column narrow, logs column wide */
  .body .col:first-child {
    flex: 2 1 0;
  }
  .body .col:last-child {
    flex: 8 1 0;
  }

  .input-wrapper { flex: 1; margin: 10px 0 8px 0; min-height: 0; }
  #transmittalsInput {
    width: 100%;
    height: 100%;
    resize: none;
  }
  #transmittalsInput::placeholder { color: var(--text-sec); }

  .bottom-row {
    display: flex;
    align-items: center;
    padding: 0 2px 10px 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .bottom-row .count { margin-left: auto; }

  #automateBtn {
    width: 100%;
    padding: 12px;
    font-size: 11pt;
    margin-top: auto;
  }

  #logBox { flex: 1; margin: 10px 0 0 0; min-height: 0; }
</style>
</head>
<body>
  <div class="app-window">

    <div class="titlebar">
      <span class="icon"><img src="../bot.ico" alt=""></span>
      <span class="title">UPLOAD SOA</span>
      <span class="spacer"></span>
      <div class="titlebar-btn" id="btnThemeToggle" title="Toggle theme">🌙</div>
      <div class="titlebar-btn" id="btnMinimize">─</div>
      <div class="titlebar-btn" id="btnMaximize">🗖</div>
      <div class="titlebar-btn close" id="btnClose">✕</div>
    </div>

    <div class="page-header">
      <div class="glyph"><img src="../bot.ico" alt=""></div>
      <div class="title-block">
        <div class="title">Upload SOA</div>
        <div class="subtitle">Statement of account transmittal upload</div>
      </div>
    </div>

    <div class="folder-section">
      <div class="section-label"><span>▸ SOA FOLDER</span><div class="rule"></div></div>
      <div class="section-row">
        <div class="folder-input-wrapper">
          <input type="text" id="soaFolderInput" readonly placeholder="No folder selected" />
        </div>
        <button class="cyber-btn" id="browseBtn">📁  BROWSE</button>
      </div>
    </div>

    <div class="body">
      <div class="col">
        <div class="section-label"><span>▸ TRANSMITTAL NUMBERS</span><div class="rule"></div></div>
        <div class="input-wrapper card">
          <textarea id="transmittalsInput" placeholder="One transmittal number per line..."></textarea>
        </div>
        <div class="bottom-row">
          <span class="count text-sec text-small" id="countLabel">0 transmittals</span>
        </div>
        <button class="solid-btn" id="automateBtn">▶  AUTOMATE UPLOAD</button>
      </div>

      <div class="col">
        <div class="section-label"><span>▸ AUTOMATION LOGS</span><div class="rule"></div></div>
        <div class="log-box" id="logBox"></div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/upload-soa.js"></script>
</body>
</html>
