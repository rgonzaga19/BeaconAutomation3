<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
/>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>About Beabots</title>

<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/about.css">

</head>

<body>

<div class="app-window">

    <!-- ================= Title bar ================= -->
    <div class="titlebar">
        <div class="icon"><img src="../bot.ico" alt=""></div>
        <div class="title">ABOUT BEABOTS</div>
        <div class="spacer"></div>
        <div class="titlebar-btn" id="btnTitlebarClose">✕</div>
    </div>

    <!-- ================= Content ================= -->
    <div class="about-content">

        <div class="brand-row">
            <div class="brand-name">BEABOTS</div>
            <div class="version" id="version">Version ...</div>
        </div>

        <!-- ================= License ================= -->

        <div class="panel card-panel">

            <div class="section-label">
                <span>▸ LICENSE INFORMATION</span>
                <div class="rule"></div>
            </div>

            <div class="info-grid">

                <div class="info-row">
                    <div class="label">Licensed To</div>
                    <div class="value" id="owner">Loading...</div>
                </div>

                <div class="info-row">
                    <div class="label">Plan</div>
                    <div class="value" id="plan">Loading...</div>
                </div>

                <div class="info-row">
                    <div class="label">License Expires</div>
                    <div class="value" id="expires">Loading...</div>
                </div>

            </div>

        </div>

        <!-- ================= Update ================= -->

        <div class="panel card-panel">

            <div class="section-label">
                <span>▸ APPLICATION UPDATES</span>
                <div class="rule"></div>
            </div>

            <div class="info-row">
                <div class="label">Latest Version</div>
                <div class="value" id="latestVersion">Checking...</div>
            </div>
            <div
                id="updateStatus"
                class="update-status">
                Checking for updates...
            </div>

            <div id="downloadSection" style="display:none;margin-top:12px;">

                <div id="downloadText" class="label">
                    Downloading update...
                </div>

                <div style="
                    width:100%;
                    height:10px;
                    margin-top:8px;
                    background:#1a2332;
                    border:1px solid #3d4d68;
                    border-radius:5px;
                    overflow:hidden;
                ">

                    <div
                        id="downloadProgressBar"
                        style="
                            width:0%;
                            height:100%;
                            background:#00c853;
                            transition:width .15s linear;
                        ">
                    </div>

                </div>

                <div
                    id="downloadPercent"
                    style="
                        margin-top:6px;
                        font-size:12px;
                        color:#9fb6d1;
                    ">
                    0%
                </div>

            </div>

            <div class="label" style="margin-top:4px;">Release Notes</div>

            <ul id="releaseNotes" class="update-notes">
            </ul>

        </div>

    </div>

    <!-- ================= Buttons ================= -->

    <div class="buttons">

        <button id="btnDownload" class="solid-btn">
            Download Update
        </button>

        <button id="btnClose" class="cyber-btn">
            Close
        </button>

    </div>

</div>

<script src="js/about.js"></script>

</body>
</html>
