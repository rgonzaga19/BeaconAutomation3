<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beabots - Beacon Automation</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme.css" />
<style>
  /* ============================================================
     Dashboard layout — restyled to match the CF2 / Upload SOA
     console read. Structure only: every #id dashboard.js touches,
     and every class it inspects or toggles, is unchanged.
     ============================================================ */

  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  .header .glyph {
    width: 34px;
    height: 34px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--accent);
    border: 1px solid var(--border);
    background: var(--bg-panel);
    border-radius: var(--radius-md);
    font-size: 16px;
  }
  .header .glyph img {
  width: 20px;
  height: 20px;
  object-fit: contain;
  display: block;
  }
  .header .brand-block { line-height: 1.3; }
  .header .brand {
    font-family: var(--font-ui);
    color: var(--text-pri);
    font-size: 15px;
    font-weight: 800;
    letter-spacing: 0.6px;
  }
  .header .version {
    color: var(--text-sec);
    font-size: 10.5px;
    letter-spacing: 0.3px;
    margin-left: 6px;
  }
  .header .version.checking { color: var(--text-sec); }
  .header .version.update-available { color: var(--warning); }
  .header .version.up-to-date { color: var(--success); }
  .header .version.offline { color: var(--error); }

  .header .status-group {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--border);
    background: var(--bg-panel);
    padding: 6px 14px;
    border-radius: 999px;
  }
  .header .status-label {
    font-size: 10px;
    letter-spacing: 0.5px;
    font-weight: bold;
    color: var(--text-sec);
  }

  .toolbar {
    display: flex;
    align-items: center;
    padding: 14px 24px 4px 24px;
    gap: 8px;
  }
  .toolbar .push-right { margin-left: auto; display: flex; gap: 8px; }

  .body {
    flex: 1;
    display: flex;
    gap: 16px;
    padding: 14px 24px 4px 24px;
    min-height: 0;
  }
  .col {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--bg-panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    padding: 4px 16px 16px 16px;
  }
  /* 30:70 split — transmittal input column narrow, logs/report column wide */
  .body .col:first-child {
    flex: 3 1 0;
  }
  .body .col:last-child {
    flex: 7 1 0;
  }

  #transmittalsInput {
    flex: 1;
    resize: none;
    width: 100%;
  }
  #transmittalsInput::placeholder { color: var(--text-sec); }
  .input-wrapper { flex: 1; display: flex; min-height: 0; margin: 10px 0 8px 0; }

  .bottom-row {
    display: flex;
    align-items: center;
    padding: 0 2px 10px 2px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 12px;
  }
  .bottom-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .bottom-row .count { margin-left: auto; }

  #startBtn {
    margin-top: auto;
    width: 100%;
    padding: 12px;
    font-size: 11pt;
  }

  #logBox {
    height: 150px;
    margin: 10px 0 14px 0;
    flex: none;
  }
  #reportBox { flex: 1; margin: 10px 0 0 0; min-height: 0; }

  .progress-frame { padding: 10px 24px 20px 24px; }
</style>
</head>
<body>
  <div class="app-window no-glow"> <!-- main dashboard keeps no outer accent border, matches ui.py's plain root -->

    <div class="titlebar">
      <span class="icon"><img src="../bot.ico" alt=""></span>
      <span class="title">BEABOTS - BEACON AUTOMATION</span>
      <span class="spacer"></span>
      <div class="titlebar-btn" id="btnThemeToggle" title="Toggle theme">🌙</div>
      <div class="titlebar-btn" id="btnMinimize">─</div>
      <div class="titlebar-btn" id="btnMaximize">🗖</div>
      <div class="titlebar-btn close" id="btnClose">✕</div>
    </div>

    <div class="header">
      <div class="glyph"><img src="../bot.ico" alt=""></div>
      <div class="brand-block">
        <span class="brand">BEABOTS</span>
        <span class="version" id="appVersion">v...</span>
        <span class="version" id="updateStatus"></span>
      </div>
      <div class="status-group">
        <span class="status-label" id="statusLabel">IDLE</span>
        <span class="status-dot" id="statusDot"></span>
      </div>
    </div>

    <div class="toolbar">
      <button class="cyber-btn" id="btnSettings">⚙ Settings</button>
      <div class="push-right">
        <button class="cyber-btn" id="btnCf2">➜ Move to CF2</button>
        <button class="cyber-btn" id="btnUploadSoa">⇪ Upload SOA</button>
        <button class="cyber-btn" id="btnCf4">🧾 CF4</button>
        <button class="cyber-btn" id="btnAbout">ℹ About</button>
      </div>
    </div>

    <div class="body">
      <div class="col">
        <div class="section-label"><span>▸ CF4 AUTO MAPPING ( Input Transmittal Numbers )</span><div class="rule"></div></div>
        <div class="input-wrapper card">
          <textarea id="transmittalsInput" placeholder="One transmittal number per line..."></textarea>
        </div>
        <div class="bottom-row">
          <label class="text-sec text-small">
            <input type="checkbox" id="autoEncodeCf4" />
            Include Auto Encode CF4
          </label>
          <span class="count text-sec text-small" id="countLabel">0 transmittals</span>
        </div>
        <button class="cyber-btn" id="startBtn" style="text-align:center;">▶ START AUTOMATION</button>
      </div>

      <div class="col">
        <div class="section-label"><span>▸ AUTOMATION LOGS</span><div class="rule"></div></div>
        <div class="log-box" id="logBox"></div>

        <div class="section-label"><span>▸ SUMMARY REPORT</span><div class="rule"></div></div>
        <div class="log-box" id="reportBox" style="white-space: pre;"></div>
      </div>
    </div>

    <div class="progress-frame">
      <div class="progress-track">
        <div class="progress-fill idle" id="progressFill"></div>
      </div>
    </div>
  </div>

  <div id="modalRoot"></div>

  <!-- socket.io-client — install via `npm install socket.io-client` in the
       Electron project; adjust this path once package.json/electron-builder
       layout is finalized. -->
  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
