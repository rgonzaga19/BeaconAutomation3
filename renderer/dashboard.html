<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Beabots - Beacon Automation</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/theme.css" />
<style>
  .toolbar { display:flex; align-items:center; padding:12px 18px; gap:8px; border-bottom:1px solid var(--border); }
  .toolbar .push-right { margin-left:auto; display:flex; gap:8px; }
  .menu-toggle { width:40px; height:38px; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; padding:0; background:var(--bg-panel); border:1px solid var(--border); border-radius:var(--radius-md); cursor:pointer; transition:background 140ms ease,border-color 140ms ease; }
  .menu-toggle:hover { background:var(--accent-soft); border-color:var(--accent); }
  .menu-toggle span { width:17px; height:2px; border-radius:2px; background:var(--text-pri); transition:transform 160ms ease,opacity 120ms ease; }
  .menu-toggle[aria-expanded="false"] span:first-child { transform:translateY(6px) rotate(45deg); }
  .menu-toggle[aria-expanded="false"] span:nth-child(2) { opacity:0; }
  .menu-toggle[aria-expanded="false"] span:last-child { transform:translateY(-6px) rotate(-45deg); }

  .dashboard-layout { flex:1; display:flex; min-height:0; }
  .sidebar { width:232px; flex:0 0 232px; display:flex; flex-direction:column; padding:14px 10px; overflow:hidden; background:var(--bg-panel); border-right:1px solid var(--border); transition:width 180ms ease,flex-basis 180ms ease; }
  .sidebar.collapsed { width:68px; flex-basis:68px; }
  .sidebar-brand { width:100%; padding:2px 3px 15px; margin-bottom:14px; color:inherit; text-align:left; background:transparent; border:0; border-bottom:1px solid var(--border); cursor:pointer; }
  .sidebar-brand:hover .brand-logo { border-color:var(--accent); background:var(--accent-soft); }
  .sidebar-brand:focus-visible { outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--radius-md); }
  .brand-row { display:flex; align-items:center; gap:11px; min-width:200px; }
  .brand-logo { width:38px; height:38px; flex:0 0 38px; display:grid; place-items:center; border:1px solid var(--border); background:var(--bg-base); border-radius:var(--radius-md); }
  .brand-logo img { width:23px; height:23px; object-fit:contain; }
  .brand-copy { min-width:0; line-height:1.25; opacity:1; transition:opacity 100ms ease; }
  .brand-name { display:block; color:var(--text-pri); font:800 14px var(--font-ui); letter-spacing:.7px; }
  .brand-meta { display:flex; align-items:center; gap:5px; margin-top:3px; white-space:nowrap; }
  .brand-meta .version { color:var(--text-sec); font-size:9.5px; letter-spacing:.2px; }
  .brand-meta .version.update-available { color:var(--warning); }
  .brand-meta .version.up-to-date { color:var(--success); }
  .brand-meta .version.offline { color:var(--error); }
  .sidebar-status { display:flex; align-items:center; gap:7px; margin:11px 2px 0; color:var(--text-sec); font-size:9px; font-weight:700; letter-spacing:.6px; white-space:nowrap; transition:margin 180ms ease; }
  .sidebar.collapsed .brand-copy, .sidebar.collapsed .status-label { opacity:0; pointer-events:none; }
  .sidebar.collapsed .sidebar-status { margin-left:15px; }
  .sidebar-nav { display:flex; flex-direction:column; gap:7px; }
  .sidebar-bottom { margin-top:auto; padding-top:12px; border-top:1px solid var(--border); }
  .side-link { width:100%; height:44px; display:flex; align-items:center; gap:12px; padding:0 13px; color:var(--text-sec); background:transparent; border:1px solid transparent; border-radius:var(--radius-md); font:700 11px var(--font-ui); letter-spacing:.25px; white-space:nowrap; cursor:pointer; transition:color 140ms ease,background 140ms ease,border-color 140ms ease; }
  .side-link:hover { color:var(--text-pri); background:var(--accent-soft); border-color:var(--border); }
  .side-link.active { color:var(--text-pri); background:var(--accent-soft-strong); border-color:var(--accent); }
  .side-link .side-icon { width:20px; min-width:20px; height:20px; display:grid; place-items:center; color:var(--accent); font-size:17px; }
  .side-link .side-label { opacity:1; transition:opacity 100ms ease; }
  .sidebar.collapsed .side-label { opacity:0; pointer-events:none; }
  .sidebar-bottom .side-link:hover { color:var(--error); }

  .body { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 24px; min-width:0; min-height:0; text-align:center; }
  .welcome-content { display:flex; flex-direction:column; align-items:center; gap:20px; }
  .welcome-icon { font-size:48px; color:var(--accent); }
  .welcome-text h2 { font-size:24px; color:var(--text-pri); margin:0; font-weight:800; letter-spacing:.5px; }
  .welcome-text p { font-size:13px; color:var(--text-sec); margin:8px 0 0; line-height:1.5; }
  @media (max-width:500px) {
    .sidebar { width:100%; flex-basis:100%; }
    .sidebar.collapsed { width:68px; flex-basis:68px; }
    .body { display:none; }
    .toolbar { padding-left:14px; padding-right:14px; }
  }
</style>
</head>
<body>
  <div class="app-window no-glow">
    <div class="titlebar">
      <span class="icon"><img src="../bot.ico" alt=""></span>
      <span class="title">BEABOTS - BEACON AUTOMATION</span>
      <span class="spacer"></span>
      <div class="titlebar-btn" id="btnThemeToggle" title="Toggle theme">☾</div>
      <div class="titlebar-btn" id="btnMinimize">─</div>
      <div class="titlebar-btn close" id="btnClose">×</div>
    </div>
    <div class="toolbar">
      <button class="menu-toggle" id="btnSidebarToggle" type="button" aria-label="Collapse sidebar" aria-controls="dashboardSidebar" aria-expanded="true"><span></span><span></span><span></span></button>
      <div class="push-right"><button class="cyber-btn" id="btnAbout">ℹ About</button></div>
    </div>
    <div class="dashboard-layout">
      <aside class="sidebar" id="dashboardSidebar" aria-label="Main navigation">
        <button class="sidebar-brand" id="btnDashboardHome" type="button" title="Dashboard Home" aria-label="Return to dashboard home">
          <div class="brand-row">
            <div class="brand-logo"><img src="../bot.ico" alt="Beabots"></div>
            <div class="brand-copy">
              <span class="brand-name">BEABOTS</span>
              <div class="brand-meta"><span class="version" id="appVersion">v...</span><span class="version" id="updateStatus"></span></div>
            </div>
          </div>
          <div class="sidebar-status"><span class="status-dot" id="statusDot"></span><span class="status-label" id="statusLabel">READY</span></div>
        </button>
        <nav class="sidebar-nav">
          <button class="side-link" id="btnCf2" type="button" title="Claim Form 2"><span class="side-icon" aria-hidden="true">➜</span><span class="side-label">Claim Form 2</span></button>
          <button class="side-link" id="btnUploadSoa" type="button" title="Auto Upload SOA"><span class="side-icon" aria-hidden="true">⇧</span><span class="side-label">Auto Upload SOA</span></button>
          <button class="side-link" id="btnCf4" type="button" title="Claim Form 4"><span class="side-icon" aria-hidden="true">▤</span><span class="side-label">Claim Form 4</span></button>
        </nav>
        <div class="sidebar-bottom"><button class="side-link" id="btnLogout" type="button" title="Log out"><span class="side-icon" aria-hidden="true">↪</span><span class="side-label">Log out</span></button></div>
      </aside>
      <main class="body">
        <div class="welcome-content"><div class="welcome-icon">◆</div><div class="welcome-text"><h2>Welcome to Beabots</h2><p>Automate your Beacon PhilHealth E-Claims workflow</p></div></div>
      </main>
    </div>
  </div>
  <div id="modalRoot"></div>
  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
